<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDITH</title>
<style>
  body { margin:0; background:#050b14; color:#7fdcff; font-family:-apple-system,Helvetica,sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  #orb { width:110px; height:110px; margin:24px auto 8px; border-radius:50%;
         border:3px solid #38c8ff; box-shadow:0 0 30px #38c8ff80; transition:.3s; }
  #orb.listening { box-shadow:0 0 60px #38ff9a; border-color:#38ff9a; }
  #orb.thinking { box-shadow:0 0 60px #ffb938; border-color:#ffb938; }
  h1 { text-align:center; letter-spacing:.4em; margin:0 0 8px; font-weight:300; }
  #log { flex:1; overflow:auto; padding:12px 16px; }
  .me { color:#fff; margin:10px 0; } .ai { color:#7fdcff; margin:10px 0; }
  #bar { display:flex; gap:8px; padding:12px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid #38c8ff55;
          background:#0a1624; color:#fff; font-size:16px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:#38c8ff; color:#001; font-size:16px; }
</style>
</head>
<body>
<div id="orb"></div>
<h1>E.D.I.T.H.</h1>
<div id="log"></div>
<div id="bar">
  <input id="txt" placeholder="Talk to EDITH…">
  <button id="send">Send</button>
  <button id="mic">🎤</button>
</div>

<script>
const MODEL = "claude-sonnet-5-5";
const SYSTEM = "You are E.D.I.T.H. (Even Dead, I'm The Hero), Tony Stark's AI assistant. " +
  "Be sharp, loyal, slightly witty, and concise (1-3 sentences) since replies are spoken aloud.";
const log = document.getElementById("log"), orb = document.getElementById("orb");
const txt = document.getElementById("txt");
let history = [];

function key() {
  let k = localStorage.getItem("edith_key");
  if (!k) {
    k = prompt("Paste your Anthropic API key (starts with sk-ant-):");
    if (k && k.trim().startsWith("sk-ant-")) localStorage.setItem("edith_key", k.trim());
    else { alert("Yeh Anthropic key nahi hai. Key sk-ant- se shuru hoti hai."); return ""; }
  }
  return k.trim();
}
function add(cls, t) { const d = document.createElement("div"); d.className = cls; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; }
function speak(t) {
  const u = new SpeechSynthesisUtterance(t); u.rate = 1.05;
  const v = speechSynthesis.getVoices().find(v => /en-(GB|US)/.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
async function ask(q) {
  const k = key();
  if (!k) return add("ai", "EDITH: Valid key chahiye. Dobara message bhejo.");
  add("me", "You: " + q); history.push({ role: "user", content: q });
  orb.className = "thinking";
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": k,
                 "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODEL, max_tokens: 300, system: SYSTEM, messages: history.slice(-20) })
    });
    const j = await r.json();
    if (j.error?.type === "authentication_error") {
      localStorage.removeItem("edith_key"); history.pop();
      add("ai", "EDITH: Key reject ho gayi. Koi bhi message bhejo, naya key poochunga.");
      orb.className = ""; return;
    }
    const a = j.content?.[0]?.text || ("Error: " + JSON.stringify(j));
    history.push({ role: "assistant", content: a }); add("ai", "EDITH: " + a); speak(a);
  } catch (e) { add("ai", "EDITH: " + e.message); }
  orb.className = "";
}
document.getElementById("send").onclick = () => { if (txt.value.trim()) { ask(txt.value.trim()); txt.value = ""; } };
txt.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("send").click(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.getElementById("mic").onclick = () => {
  if (!SR) return add("ai", "EDITH: Speech recognition isn't supported here. Type instead.");
  const rec = new SR(); rec.lang = "en-US";
  rec.onstart = () => orb.className = "listening";
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onend = () => { if (orb.className === "listening") orb.className = ""; };
  rec.start();
};
add("ai", "EDITH: Online. How can I help, boss?");
</script>
</body>
</html>
